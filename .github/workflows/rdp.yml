name: Roblox Studio RDP V4

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. PREPARE WINDOWS + RDP
      # ============================================================
      - name: Prepare Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Preparing Windows..."

          # RDP USER
          $UserName = "3NB"
          $PasswordPlain = "roblox"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          $ExistingUser = Get-LocalUser -Name $UserName -ErrorAction SilentlyContinue

          if (-not $ExistingUser) {
              New-LocalUser `
                -Name $UserName `
                -Password $Password `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Remote Desktop User"
          }
          else {
              Set-LocalUser `
                -Name $UserName `
                -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          # ENABLE RDP
          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # PERFORMANCE / POWER
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /hibernate off

          powercfg /setactive SCHEME_MIN

          # REDUCE VISUAL EFFECTS
          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          # DISABLE WINDOWS SEARCH INDEXING
          Stop-Service WSearch -Force -ErrorAction SilentlyContinue
          Set-Service WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          # PREVENT NORMAL AUTO-REBOOT WHILE LOGGED IN
          New-Item `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Force `
            | Out-Null

          Set-ItemProperty `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Name "NoAutoRebootWithLoggedOnUsers" `
            -Type DWord `
            -Value 1

          Write-Host "Windows preparation complete."


      # ============================================================
      # 2. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading Tailscale..."

          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /qn /norestart" `
            -Wait

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Connecting Tailscale..."

          & $Tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="github-roblox-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          Write-Host "Tailscale IPv4:"
          & $Tailscale ip -4


      # ============================================================
      # 3. CHECK WINGET
      # ============================================================
      - name: Check WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Checking WinGet..."

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($Winget) {
              Write-Host "WinGet found."
              winget --version
          }
          else {
              Write-Host "WinGet is not available."
              Write-Host "OpenAI apps will be skipped if Store installation is unavailable."
          }


      # ============================================================
      # 4. INSTALL CHROME
      # ============================================================
      - name: Install Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($Winget) {

              Write-Host "Installing Google Chrome..."

              winget install `
                --id Google.Chrome `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

          }
          else {
              Write-Host "Skipping Chrome because WinGet is unavailable."
          }


      # ============================================================
      # 5. INSTALL 7-ZIP
      # ============================================================
      - name: Install 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($Winget) {

              Write-Host "Installing 7-Zip..."

              winget install `
                --id 7zip.7zip `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

          }
          else {
              Write-Host "Skipping 7-Zip."
          }


      # ============================================================
      # 6. INSTALL CHATGPT WINDOWS APP
      # ============================================================
      - name: Install ChatGPT Windows App
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Installing ChatGPT Windows App"
          Write-Host "======================================"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (-not $Winget) {
              Write-Host "WinGet unavailable - skipping ChatGPT."
              exit 0
          }

          winget install `
            --id 9NT1R1C2HH7J `
            --exact `
            --source msstore `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "ChatGPT installation attempt finished."


      # ============================================================
      # 7. INSTALL CODEX
      # ============================================================
      - name: Install Codex
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Installing Codex"
          Write-Host "======================================"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (-not $Winget) {
              Write-Host "WinGet unavailable - skipping Codex."
              exit 0
          }

          winget install `
            --id 9PLM9XGG6VKS `
            --exact `
            --source msstore `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Codex installation attempt finished."


      # ============================================================
      # 8. DOWNLOAD + INSTALL ROBLOX STUDIO
      # ============================================================
      - name: Install Roblox Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Installing Roblox Studio"
          Write-Host "======================================"

          $Installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Invoke-WebRequest `
            -Uri "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" `
            -OutFile $Installer

          if (-not (Test-Path $Installer)) {
              throw "Roblox Studio installer was not downloaded."
          }

          Write-Host "Starting Roblox Studio installer..."

          $Process = Start-Process `
            -FilePath $Installer `
            -ArgumentList "-install" `
            -PassThru

          $Process | Wait-Process

          Write-Host "Waiting for installation..."

          Start-Sleep -Seconds 15

          $Studio = Get-ChildItem `
            "$env:LOCALAPPDATA\Roblox\Versions\*\RobloxStudioBeta.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $Studio) {

              $Studio = Get-ChildItem `
                "$env:ProgramFiles\Roblox\Versions\*\RobloxStudioBeta.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
          }

          if (-not $Studio) {
              throw "RobloxStudioBeta.exe was not found."
          }

          Write-Host ""
          Write-Host "Roblox Studio found:"
          Write-Host $Studio.FullName

          # DESKTOP SHORTCUT
          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $Shell = New-Object -ComObject WScript.Shell

          $Shortcut = $Shell.CreateShortcut(
              "$Desktop\Roblox Studio.lnk"
          )

          $Shortcut.TargetPath = $Studio.FullName
          $Shortcut.WorkingDirectory = Split-Path $Studio.FullName
          $Shortcut.Save()

          Write-Host "Roblox Studio shortcut created."


      # ============================================================
      # 9. CREATE CHATGPT WEB FALLBACK SHORTCUT
      # ============================================================
      - name: Create ChatGPT fallback
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $Chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) |
          Where-Object {
              Test-Path $_
          } |
          Select-Object -First 1

          if ($Chrome) {

              $Shell = New-Object -ComObject WScript.Shell

              $Shortcut = $Shell.CreateShortcut(
                  "$Desktop\ChatGPT Web.lnk"
              )

              $Shortcut.TargetPath = $Chrome
              $Shortcut.Arguments = "https://chatgpt.com/"
              $Shortcut.WorkingDirectory = Split-Path $Chrome
              $Shortcut.Save()

              Write-Host "ChatGPT Web fallback shortcut created."

          }
          else {

              Write-Host "Chrome was not found."

          }


      # ============================================================
      # 10. PERFORMANCE OPTIMIZATION
      # ============================================================
      - name: Optimize performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Optimizing background processes..."

          $Processes = @(
              "OneDrive",
              "MicrosoftTeams",
              "Widgets",
              "SearchHost"
          )

          foreach ($Name in $Processes) {

              Get-Process `
                -Name $Name `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Set Roblox Studio high priority if running
          Get-Process `
            -Name RobloxStudioBeta `
            -ErrorAction SilentlyContinue |
            ForEach-Object {

                try {
                    $_.PriorityClass = "High"
                }
                catch {}
            }

          Write-Host "Performance optimization complete."


      # ============================================================
      # 11. SHOW CONNECTION DETAILS
      # ============================================================
      - name: Show RDP information
        shell: powershell
        run: |
          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             RDP IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Username:"
          Write-Host "3NB"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "******"
          Write-Host ""
          Write-Host "Tailscale IP:"
          & $Tailscale ip -4
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Roblox Studio is installed."
          Write-Host "ChatGPT/Codex installation was attempted."
          Write-Host "=============================================="


      # ============================================================
      # 12. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RUNNER IS NOW READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Roblox Studio: READY"
          Write-Host "RDP: READY"
          Write-Host "Tailscale: READY"
          Write-Host "ChatGPT/Codex: INSTALL ATTEMPTED"
          Write-Host ""

          while ($true) {

              # Keep Roblox Studio priority high
              Get-Process `
                -Name RobloxStudioBeta `
                -ErrorAction SilentlyContinue |
                ForEach-Object {

                    try {
                        $_.PriorityClass = "High"
                    }
                    catch {}
                }

              Start-Sleep -Seconds 9999999

              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - Runner alive"
          }
