name: Roblox Studio RDP V5

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. WINDOWS + RDP
      # ============================================================
      - name: Prepare Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Preparing Windows..."

          $UserName = "3NB"

          # غيّر كلمة المرور هذه قبل التشغيل
          $PasswordPlain = "511"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          $ExistingUser = Get-LocalUser -Name $UserName -ErrorAction SilentlyContinue

          if (-not $ExistingUser) {
              New-LocalUser `
                -Name $UserName `
                -Password $Password `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Remote Desktop User"
          }
          else {
              Set-LocalUser `
                -Name $UserName `
                -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          # Enable RDP
          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Performance / power
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /hibernate off

          # High performance
          powercfg /setactive SCHEME_MIN

          # Reduce Windows animations/effects
          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          # Disable indexing to reduce background CPU/disk use
          Stop-Service WSearch -Force -ErrorAction SilentlyContinue
          Set-Service WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          # Prevent automatic reboot while logged in
          New-Item `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Force `
            | Out-Null

          Set-ItemProperty `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Name "NoAutoRebootWithLoggedOnUsers" `
            -Type DWord `
            -Value 1

          Write-Host "Windows preparation finished."


      # ============================================================
      # 2. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading Tailscale..."

          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /qn /norestart" `
            -Wait

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Connecting Tailscale..."

          & $Tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="github-roblox-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          & $Tailscale ip -4


      # ============================================================
      # 3. CHECK WINGET ONLY
      # ============================================================
      - name: Check WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Checking WinGet..."

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($Winget) {
              Write-Host "WinGet is available."
              winget --version
          }
          else {
              Write-Host "WinGet is unavailable."
              Write-Host "Continuing anyway..."
          }


      # ============================================================
      # 4. CHATGPT APP
      # ============================================================
      - name: Install ChatGPT App
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Attempting ChatGPT Windows App"
          Write-Host "======================================"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (-not $Winget) {
              Write-Host "WinGet unavailable."
              Write-Host "Skipping ChatGPT app installation."
              exit 0
          }

          try {

              winget install `
                --id 9NT1R1C2HH7J `
                --exact `
                --source msstore `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Write-Host "ChatGPT installation command completed."

          }
          catch {

              Write-Host "ChatGPT installation failed."
              Write-Host "Continuing without stopping the workflow."

          }


      # ============================================================
      # 5. CODEX APP
      # ============================================================
      - name: Install Codex App
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Attempting Codex Windows App"
          Write-Host "======================================"

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (-not $Winget) {
              Write-Host "WinGet unavailable."
              Write-Host "Skipping Codex installation."
              exit 0
          }

          try {

              winget install `
                --id 9PLM9XGG6VKS `
                --exact `
                --source msstore `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Write-Host "Codex installation command completed."

          }
          catch {

              Write-Host "Codex installation failed."
              Write-Host "Continuing without stopping the workflow."

          }


      # ============================================================
      # 6. ROBLOX STUDIO
      # ============================================================
      - name: Install Roblox Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Installing Roblox Studio"
          Write-Host "======================================"

          $Installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Write-Host "Downloading Roblox Studio..."

          Invoke-WebRequest `
            -Uri "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" `
            -OutFile $Installer

          if (-not (Test-Path $Installer)) {
              throw "Roblox Studio installer download failed."
          }

          Write-Host "Starting Roblox Studio installer..."

          $Process = Start-Process `
            -FilePath $Installer `
            -ArgumentList "-install" `
            -PassThru

          $Process | Wait-Process

          Write-Host "Waiting for Roblox Studio..."

          Start-Sleep -Seconds 15

          # Search for Studio
          $Studio = Get-ChildItem `
            "$env:LOCALAPPDATA\Roblox\Versions\*\RobloxStudioBeta.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $Studio) {

              $Studio = Get-ChildItem `
                "$env:ProgramFiles\Roblox\Versions\*\RobloxStudioBeta.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
          }

          if (-not $Studio) {
              throw "RobloxStudioBeta.exe was not found."
          }

          Write-Host ""
          Write-Host "Roblox Studio found:"
          Write-Host $Studio.FullName

          # Create desktop shortcut
          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $Shell = New-Object -ComObject WScript.Shell

          $Shortcut = $Shell.CreateShortcut(
              "$Desktop\Roblox Studio.lnk"
          )

          $Shortcut.TargetPath = $Studio.FullName
          $Shortcut.WorkingDirectory = Split-Path $Studio.FullName
          $Shortcut.Save()

          Write-Host "Roblox Studio shortcut created."


      # ============================================================
      # 7. CHATGPT WEB FALLBACK
      # ============================================================
      - name: Create ChatGPT Web Shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          # Chrome should already exist on the GitHub runner.
          $ChromePaths = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )

          $Browser = $ChromePaths |
            Where-Object {
                Test-Path $_
            } |
            Select-Object -First 1

          if ($Browser) {

              $Shell = New-Object -ComObject WScript.Shell

              $Shortcut = $Shell.CreateShortcut(
                  "$Desktop\ChatGPT Web.lnk"
              )

              $Shortcut.TargetPath = $Browser
              $Shortcut.Arguments = "https://chatgpt.com/"
              $Shortcut.WorkingDirectory = Split-Path $Browser
              $Shortcut.Save()

              Write-Host "ChatGPT Web shortcut created."

          }
          else {

              Write-Host "No browser found."

          }


      # ============================================================
      # 8. PERFORMANCE
      # ============================================================
      - name: Optimize performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Optimizing background processes..."

          $Processes = @(
              "OneDrive",
              "MicrosoftTeams",
              "Widgets",
              "SearchHost"
          )

          foreach ($Name in $Processes) {

              Get-Process `
                -Name $Name `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Roblox Studio gets High priority when running
          Get-Process `
            -Name RobloxStudioBeta `
            -ErrorAction SilentlyContinue |
            ForEach-Object {

                try {
                    $_.PriorityClass = "High"
                }
                catch {}
            }

          Write-Host "Performance optimization complete."


      # ============================================================
      # 9. CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Username:"
          Write-Host "3NB"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "511"
          Write-Host ""
          Write-Host "Tailscale IP:"
          & $Tailscale ip -4
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Roblox Studio: INSTALLED"
          Write-Host "ChatGPT: ATTEMPTED"
          Write-Host "Codex: ATTEMPTED"
          Write-Host "=============================================="


      # ============================================================
      # 10. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             RUNNER IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Roblox Studio : READY"
          Write-Host "RDP           : READY"
          Write-Host "Tailscale     : READY"
          Write-Host "ChatGPT       : ATTEMPTED"
          Write-Host "Codex         : ATTEMPTED"
          Write-Host ""

          while ($true) {

              # Keep Roblox Studio at high priority
              Get-Process `
                -Name RobloxStudioBeta `
                -ErrorAction SilentlyContinue |
                ForEach-Object {

                    try {
                        $_.PriorityClass = "High"
                    }
                    catch {}
                }

              Start-Sleep -Seconds 99999

              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - Runner alive"
          }
