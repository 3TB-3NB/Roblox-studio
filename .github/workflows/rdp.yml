name: Roblox Studio RDP V3 - ChatGPT + Codex

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. PREPARE WINDOWS
      # ============================================================
      - name: Prepare Windows for stable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "Preparing Windows..."

          # ----------------------------
          # RDP USER
          # ----------------------------
          $UserName = "3NB"
          $PasswordPlain = "roblox"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          $ExistingUser = Get-LocalUser -Name $UserName -ErrorAction SilentlyContinue

          if (-not $ExistingUser) {
              New-LocalUser `
                -Name $UserName `
                -Password $Password `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Remote Desktop User"
          }
          else {
              Set-LocalUser `
                -Name $UserName `
                -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          # ----------------------------
          # ENABLE RDP
          # ----------------------------
          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # ----------------------------
          # PERFORMANCE
          # ----------------------------
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /hibernate off

          powercfg /setactive SCHEME_MIN

          # Disable unnecessary indexing
          Stop-Service WSearch -Force -ErrorAction SilentlyContinue
          Set-Service WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          # Reduce visual effects
          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          # Prevent automatic reboot while logged in
          New-Item `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Force `
            | Out-Null

          Set-ItemProperty `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" `
            -Name "NoAutoRebootWithLoggedOnUsers" `
            -Type DWord `
            -Value 1

          Write-Host "Windows preparation complete."


      # ============================================================
      # 2. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading Tailscale..."

          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /qn /norestart" `
            -Wait

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Connecting Tailscale..."

          & $Tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="github-roblox-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          Write-Host "Tailscale IP:"
          & $Tailscale ip -4


      # ============================================================
      # 3. UPDATE WINGET
      # ============================================================
      - name: Prepare WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Checking WinGet..."

          winget --version

          winget source reset --force
          winget source update --accept-source-agreements

          Write-Host "WinGet ready."


      # ============================================================
      # 4. INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing Google Chrome..."

          winget install `
            --id Google.Chrome `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Chrome installation finished."


      # ============================================================
      # 5. INSTALL 7-ZIP
      # ============================================================
      - name: Install 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          winget install `
            --id 7zip.7zip `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "7-Zip installed."


      # ============================================================
      # 6. INSTALL CHATGPT WINDOWS APP
      # ============================================================
      - name: Install ChatGPT Windows App
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "Installing official ChatGPT Windows App"
          Write-Host "=========================================="

          winget install `
            --id 9NT1R1C2HH7J `
            --exact `
            --source msstore `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 10

          Write-Host "ChatGPT installation command finished."


      # ============================================================
      # 7. INSTALL CODEX
      # ============================================================
      - name: Install Codex Windows App
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "Installing official Codex Windows App"
          Write-Host "=========================================="

          winget install `
            --id 9PLM9XGG6VKS `
            --exact `
            --source msstore `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 10

          Write-Host "Codex installation command finished."


      # ============================================================
      # 8. INSTALL ROBLOX STUDIO
      # ============================================================
      - name: Install Roblox Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Downloading Roblox Studio"
          Write-Host "=========================================="

          $Installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Invoke-WebRequest `
            -Uri "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" `
            -OutFile $Installer

          if (-not (Test-Path $Installer)) {
              throw "Roblox Studio installer was not downloaded."
          }

          Write-Host "Starting Roblox Studio installer..."

          $Process = Start-Process `
            -FilePath $Installer `
            -ArgumentList "-install" `
            -PassThru

          $Process | Wait-Process

          Write-Host "Waiting for Roblox Studio files..."

          Start-Sleep -Seconds 15

          $Studio = Get-ChildItem `
            "$env:LOCALAPPDATA\Roblox\Versions\*\RobloxStudioBeta.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $Studio) {

              $Studio = Get-ChildItem `
                "$env:ProgramFiles\Roblox\Versions\*\RobloxStudioBeta.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
          }

          if (-not $Studio) {
              throw "RobloxStudioBeta.exe was not found."
          }

          Write-Host "Roblox Studio:"
          Write-Host $Studio.FullName

          # Create Desktop shortcut
          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $Shell = New-Object -ComObject WScript.Shell

          $Shortcut = $Shell.CreateShortcut(
              "$Desktop\Roblox Studio.lnk"
          )

          $Shortcut.TargetPath = $Studio.FullName
          $Shortcut.WorkingDirectory = Split-Path $Studio.FullName
          $Shortcut.Save()

          Write-Host "Roblox Studio shortcut created."


      # ============================================================
      # 9. CREATE CHATGPT SHORTCUT
      # ============================================================
      - name: Create ChatGPT shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $ChatGPTLocations = @(
              "$env:LOCALAPPDATA\Microsoft\WindowsApps\ChatGPT.exe",
              "$env:LOCALAPPDATA\Programs\ChatGPT\ChatGPT.exe",
              "$env:ProgramFiles\ChatGPT\ChatGPT.exe"
          )

          $ChatGPT = $ChatGPTLocations |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($ChatGPT) {

              $Shell = New-Object -ComObject WScript.Shell

              $Shortcut = $Shell.CreateShortcut(
                  "$Desktop\ChatGPT.lnk"
              )

              $Shortcut.TargetPath = $ChatGPT
              $Shortcut.Save()

              Write-Host "ChatGPT desktop shortcut created."
          }
          else {
              Write-Host "ChatGPT executable was not found yet."
              Write-Host "The app may still be registered through Microsoft Store."
          }


      # ============================================================
      # 10. CREATE CODEX SHORTCUT
      # ============================================================
      - name: Create Codex shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $CodexLocations = @(
              "$env:LOCALAPPDATA\Microsoft\WindowsApps\Codex.exe",
              "$env:LOCALAPPDATA\Programs\Codex\Codex.exe",
              "$env:ProgramFiles\Codex\Codex.exe"
          )

          $Codex = $CodexLocations |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($Codex) {

              $Shell = New-Object -ComObject WScript.Shell

              $Shortcut = $Shell.CreateShortcut(
                  "$Desktop\Codex.lnk"
              )

              $Shortcut.TargetPath = $Codex
              $Shortcut.Save()

              Write-Host "Codex desktop shortcut created."
          }
          else {
              Write-Host "Codex executable path was not found."
              Write-Host "The application can still be available from Start Menu."
          }


      # ============================================================
      # 11. PERFORMANCE CLEANUP
      # ============================================================
      - name: Optimize background processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Cleaning unnecessary background processes..."

          $Processes = @(
              "OneDrive",
              "MicrosoftTeams",
              "Widgets",
              "SearchHost"
          )

          foreach ($Name in $Processes) {

              Get-Process `
                -Name $Name `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Roblox Studio priority
          Get-Process `
            -Name RobloxStudioBeta `
            -ErrorAction SilentlyContinue |
            ForEach-Object {

                try {
                    $_.PriorityClass = "High"
                }
                catch {}
            }

          Write-Host "Performance cleanup complete."


      # ============================================================
      # 12. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP information
        shell: powershell
        run: |
          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          ROBLOX RDP IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Username:"
          Write-Host "3NB"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "roblox"
          Write-Host ""
          Write-Host "Tailscale IP:"
          & $Tailscale ip -4
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Keep this workflow running."
          Write-Host "=============================================="


      # ============================================================
      # 13. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Everything is ready."
          Write-Host "Roblox Studio + ChatGPT + Codex"
          Write-Host "=============================================="

          while ($true) {

              Get-Process `
                -Name RobloxStudioBeta `
                -ErrorAction SilentlyContinue |
                ForEach-Object {

                    try {
                        $_.PriorityClass = "High"
                    }
                    catch {}
                }

              Start-Sleep -Seconds 9999999

              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - Runner alive"
          }
