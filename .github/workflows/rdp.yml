name: Windows RDP V6

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. إنشاء حساب RDP + تفعيل Remote Desktop
      # =========================================================
      - name: Setup Windows RDP
        shell: powershell
        run: |
          $UserName = "3NB"
          $PasswordPlain = "aboatb2026!"

          Write-Host "Creating RDP user..."

          $SecurePassword = ConvertTo-SecureString `
            $PasswordPlain `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser -Name $UserName -ErrorAction SilentlyContinue

          if ($ExistingUser) {
              Write-Host "User already exists."
              Set-LocalUser -Name $UserName -Password $SecurePassword
          }
          else {
              New-LocalUser `
                -Name $UserName `
                -Password $SecurePassword `
                -FullName "RDP User" `
                -Description "Temporary RDP user" `
                -PasswordNeverExpires:$true `
                -AccountNeverExpires:$true
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $UserName `
            -ErrorAction SilentlyContinue

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Write-Host "================================"
          Write-Host "RDP USER READY"
          Write-Host "Username: 3NB"
          Write-Host "Password: aboatb2026!"
          Write-Host "================================"


      # =========================================================
      # 2. تحسين أداء Windows
      # =========================================================
      - name: Windows Performance Optimization
        shell: powershell
        run: |
          Write-Host "Optimizing Windows..."

          powercfg /setactive SCHEME_MIN

          powercfg /change -standby-timeout-ac 0
          powercfg /change -hibernate-timeout-ac 0
          powercfg /hibernate off

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          Stop-Service WSearch -Force -ErrorAction SilentlyContinue
          Set-Service WSearch -StartupType Disabled -ErrorAction SilentlyContinue

          Stop-Service SysMain -Force -ErrorAction SilentlyContinue
          Set-Service SysMain -StartupType Disabled -ErrorAction SilentlyContinue

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fDisableWallpaper" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fDisableFullWindowDrag" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fDisableMenuAnims" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fDisableThemes" `
            -Type DWord `
            -Value 1

          Write-Host "Performance optimization complete."


      # =========================================================
      # 3. تثبيت Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          Write-Host "Downloading Tailscale..."

          $Installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$Installer`" /qn /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TS_AUTH_KEY secret is missing."
              exit 1
          }

          Write-Host "Connecting Tailscale..."

          & $Tailscale up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="github-rdp-v6"

          Start-Sleep -Seconds 5

          Write-Host "Tailscale status:"
          & $Tailscale status


      # =========================================================
      # 4. فحص WinGet فقط
      # =========================================================
      - name: Check WinGet
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Checking WinGet..."

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($Winget) {
              Write-Host "WinGet found."
              winget --version
          }
          else {
              Write-Host "WinGet is not available."
              Write-Host "Continuing without WinGet."
          }


      # =========================================================
      # 5. محاولة تثبيت ChatGPT
      # =========================================================
      - name: Install ChatGPT
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Trying to install ChatGPT..."

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (!$Winget) {
              Write-Host "WinGet unavailable - skipping ChatGPT app."
              exit 0
          }

          try {
              winget install `
                --id 9NT1R1C2HH7J `
                --exact `
                --source msstore `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Write-Host "ChatGPT installation command finished."
          }
          catch {
              Write-Host "ChatGPT app installation was unavailable."
              Write-Host "Continuing workflow..."
          }


      # =========================================================
      # 6. محاولة تثبيت Codex
      # =========================================================
      - name: Install Codex
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Trying to install Codex..."

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (!$Winget) {
              Write-Host "WinGet unavailable - skipping Codex app."
              exit 0
          }

          try {
              winget install `
                --id 9PLM9XGG6VKS `
                --exact `
                --source msstore `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Write-Host "Codex installation command finished."
          }
          catch {
              Write-Host "Codex app installation was unavailable."
              Write-Host "Continuing workflow..."
          }


      # =========================================================
      # 7. إنشاء اختصار ChatGPT
      # =========================================================
      - name: Create ChatGPT Shortcut
        shell: powershell
        run: |
          Write-Host "Creating ChatGPT shortcut..."

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $ChromePaths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
              "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $Chrome = $null

          foreach ($Path in $ChromePaths) {
              if (Test-Path $Path) {
                  $Chrome = $Path
                  break
              }
          }

          if ($Chrome) {

              $ShortcutPath = Join-Path $Desktop "ChatGPT.lnk"

              $Shell = New-Object -ComObject WScript.Shell
              $Shortcut = $Shell.CreateShortcut($ShortcutPath)

              $Shortcut.TargetPath = $Chrome
              $Shortcut.Arguments = "https://chatgpt.com"
              $Shortcut.WorkingDirectory = Split-Path $Chrome
              $Shortcut.Description = "Open ChatGPT"

              $Shortcut.Save()

              Write-Host "ChatGPT shortcut created."

          }
          else {
              Write-Host "Chrome was not found."
              Write-Host "Skipping shortcut."
          }


      # =========================================================
      # 8. تنظيف إضافي
      # =========================================================
      - name: Final Windows Cleanup
        shell: powershell
        run: |
          Write-Host "Final cleanup..."

          $Processes = @(
              "OneDrive",
              "Teams",
              "Widgets",
              "SearchHost"
          )

          foreach ($ProcessName in $Processes) {
              Get-Process $ProcessName -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup complete."


      # =========================================================
      # 9. ROBLOX STUDIO - آخر تثبيت
      # =========================================================
      - name: Install Roblox Studio
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Installing Roblox Studio..."
          Write-Host "This is the final installation step."
          Write-Host "======================================"

          $Installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Write-Host "Downloading official Roblox Studio installer..."

          Invoke-WebRequest `
            -Uri "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" `
            -OutFile $Installer

          if (!(Test-Path $Installer)) {
              Write-Error "Roblox Studio installer was not downloaded."
              exit 1
          }

          Write-Host "Installing Roblox Studio..."

          $Process = Start-Process `
            -FilePath $Installer `
            -ArgumentList "-install" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($Process.ExitCode)"

          Start-Sleep -Seconds 10

          Write-Host "Searching for RobloxStudioBeta.exe..."

          $RobloxExe = $null

          $SearchPaths = @(
              "C:\Program Files (x86)\Roblox\Versions",
              "$env:LOCALAPPDATA\Roblox\Versions"
          )

          foreach ($Path in $SearchPaths) {

              if (Test-Path $Path) {

                  $Found = Get-ChildItem `
                    -Path $Path `
                    -Filter "RobloxStudioBeta.exe" `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1

                  if ($Found) {
                      $RobloxExe = $Found.FullName
                      break
                  }
              }
          }

          if (!$RobloxExe) {
              Write-Error "Roblox Studio was not found after installation."
              exit 1
          }

          Write-Host "Roblox Studio found:"
          Write-Host $RobloxExe

          $Desktop = [Environment]::GetFolderPath("CommonDesktopDirectory")

          $ShortcutPath = Join-Path $Desktop "Roblox Studio.lnk"

          $Shell = New-Object -ComObject WScript.Shell
          $Shortcut = $Shell.CreateShortcut($ShortcutPath)

          $Shortcut.TargetPath = $RobloxExe
          $Shortcut.WorkingDirectory = Split-Path $RobloxExe
          $Shortcut.Description = "Roblox Studio"

          $Shortcut.Save()

          Write-Host "Roblox Studio shortcut created."

          Write-Host "======================================"
          Write-Host "ROBLOX STUDIO INSTALLATION COMPLETE"
          Write-Host "======================================"


      # =========================================================
      # 10. معلومات الاتصال
      # =========================================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP INFORMATION"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Username: 3NB"
          Write-Host "Password: aboatb2026!"
          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host ""

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (Test-Path $Tailscale) {
              & $Tailscale ip -4
          }

          Write-Host ""
          Write-Host "RDP Port: 3389"
          Write-Host "=========================================="
          Write-Host ""


      # =========================================================
      # 11. إبقاء السيرفر شغال
      # =========================================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RDP SERVER IS READY"
          Write-Host "=========================================="
          Write-Host "Username: 3NB"
          Write-Host "Password: aboatb2026!"
          Write-Host ""
          Write-Host "Runner will stay alive until timeout."
          Write-Host "=========================================="

          while ($true) {
              Start-Sleep -Seconds 999999
              Write-Host "$(Get-Date) - RDP server still running..."
          }
