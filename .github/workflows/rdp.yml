name: Windows RDP V6

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      RDP_USER: '3NB'
      RDP_DATA: 'C:\RDPData'
      RCLONE_DIR: 'C:\Rclone'
      RCLONE_EXE: 'C:\Rclone\rclone.exe'
      RCLONE_CONFIG: 'C:\Rclone\rclone.conf'
      RCLONE_REMOTE: 'gdrive:RDP-V6-Persistent'
      SYNC_INTERVAL: '30'

    steps:

      # ============================================================
      # 1. تجهيز مجلد الحفظ
      # ============================================================

      - name: Prepare persistent storage
        shell: powershell
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $env:RDP_DATA | Out-Null

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $env:RCLONE_DIR | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICE_ACCOUNT_JSON)) {
              throw "GOOGLE_SERVICE_ACCOUNT_JSON secret is empty."
          }

          $jsonPath = Join-Path `
              $env:RCLONE_DIR `
              "service-account.json"

          [System.IO.File]::WriteAllText(
              $jsonPath,
              $env:GOOGLE_SERVICE_ACCOUNT_JSON,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Persistent storage prepared."

      # ============================================================
      # 2. تنزيل rclone فقط
      # ============================================================

      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = Join-Path `
              $env:TEMP `
              "rclone.zip"

          $extractPath = Join-Path `
              $env:TEMP `
              "rclone_extract"

          Remove-Item `
              $zipPath `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              $extractPath `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "Downloading rclone..."

          Invoke-WebRequest `
              -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile $zipPath

          Expand-Archive `
              -Path $zipPath `
              -DestinationPath $extractPath `
              -Force

          $rcloneSource = Get-ChildItem `
              -Path $extractPath `
              -Filter "rclone.exe" `
              -Recurse |
              Select-Object -First 1

          if (-not $rcloneSource) {
              throw "rclone.exe was not found."
          }

          Copy-Item `
              -Path $rcloneSource.FullName `
              -Destination $env:RCLONE_EXE `
              -Force

          & $env:RCLONE_EXE version

          if ($LASTEXITCODE -ne 0) {
              throw "rclone installation failed."
          }

          Write-Host "rclone installed successfully."

      # ============================================================
      # 3. إعداد Google Drive
      # ============================================================

      - name: Configure Google Drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $config = @"
          [gdrive]
          type = drive
          scope = drive
          service_account_file = C:\Rclone\service-account.json
          "@

          Set-Content `
              -Path $env:RCLONE_CONFIG `
              -Value $config `
              -Encoding UTF8

          Write-Host "Testing Google Drive connection..."

          & $env:RCLONE_EXE `
              --config $env:RCLONE_CONFIG `
              lsd gdrive:

          if ($LASTEXITCODE -ne 0) {
              throw "Google Drive connection failed."
          }

          Write-Host "Google Drive connection OK."

      # ============================================================
      # 4. إنشاء مجلد الحفظ إذا لم يكن موجودًا
      # ============================================================

      - name: Create persistent Google Drive folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Google Drive folder..."

          & $env:RCLONE_EXE `
              --config $env:RCLONE_CONFIG `
              mkdir `
              $env:RCLONE_REMOTE

          if ($LASTEXITCODE -ne 0) {
              throw "Could not create/access Google Drive folder: RDP-V6-Persistent"
          }

          Write-Host "Google Drive folder is ready."

          Write-Host "Verifying folder..."

          & $env:RCLONE_EXE `
              --config $env:RCLONE_CONFIG `
              lsf `
              $env:RCLONE_REMOTE `
              --max-depth 1

          if ($LASTEXITCODE -ne 0) {
              throw "Google Drive folder verification failed."
          }

      # ============================================================
      # 5. استرجاع الملفات القديمة
      # ============================================================

      - name: Restore saved files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $env:RDP_DATA | Out-Null

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RESTORING SAVED FILES"
          Write-Host "=========================================="

          & $env:RCLONE_EXE `
              --config $env:RCLONE_CONFIG `
              sync `
              $env:RCLONE_REMOTE `
              $env:RDP_DATA `
              --create-empty-src-dirs `
              --fast-list `
              --transfers 8 `
              --checkers 16

          if ($LASTEXITCODE -ne 0) {
              throw "Restore failed. rclone exit code: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Restore completed successfully."

      # ============================================================
      # 6. إنشاء مستخدم RDP
      # ============================================================

      - name: Configure RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is empty."
          }

          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $env:RDP_USER `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Set-LocalUser `
                  -Name $env:RDP_USER `
                  -Password $securePassword

          }
          else {

              New-LocalUser `
                  -Name $env:RDP_USER `
                  -Password $securePassword `
                  -PasswordNeverExpires `
                  -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $env:RDP_USER `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $env:RDP_USER `
              -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      # ============================================================
      # 7. تشغيل Remote Desktop
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
              -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Set-ItemProperty `
              -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 1

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop"

          Restart-Service `
              -Name TermService `
              -Force

          Write-Host "Remote Desktop enabled."

      # ============================================================
      # 8. مجلدات المستخدم المحفوظة
      # ============================================================

      - name: Create persistent user folders
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $folders = @(
              "Desktop",
              "Downloads",
              "Documents",
              "Pictures",
              "Videos",
              "Music"
          )

          $profilePath = "C:\Users\$env:RDP_USER"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $profilePath | Out-Null

          foreach ($folder in $folders) {

              $persistentPath = Join-Path `
                  $env:RDP_DATA `
                  $folder

              $userPath = Join-Path `
                  $profilePath `
                  $folder

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path $persistentPath | Out-Null

              if (Test-Path $userPath) {

                  $item = Get-Item `
                      -Path $userPath `
                      -Force `
                      -ErrorAction SilentlyContinue

                  if ($item -and
                      -not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {

                      Get-ChildItem `
                          -Path $userPath `
                          -Force `
                          -ErrorAction SilentlyContinue |
                          Copy-Item `
                              -Destination $persistentPath `
                              -Recurse `
                              -Force `
                              -ErrorAction SilentlyContinue

                      Remove-Item `
                          -Path $userPath `
                          -Recurse `
                          -Force `
                          -ErrorAction SilentlyContinue
                  }
              }

              if (-not (Test-Path $userPath)) {

                  New-Item `
                      -ItemType Junction `
                      -Path $userPath `
                      -Target $persistentPath | Out-Null
              }
          }

          Write-Host "Persistent user folders created."

      # ============================================================
      # 9. تحسين الأداء بدون تنزيل تطبيقات
      # ============================================================

      - name: Optimize Windows performance
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # High Performance power plan
          powercfg /setactive SCHEME_MIN

          # تقليل المؤثرات البصرية
          $visualEffects = `
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

          New-Item `
              -Path $visualEffects `
              -Force | Out-Null

          Set-ItemProperty `
              -Path $visualEffects `
              -Name "VisualFXSetting" `
              -Type DWord `
              -Value 2

          # إيقاف الشفافية
          $personalize = `
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item `
              -Path $personalize `
              -Force | Out-Null

          Set-ItemProperty `
              -Path $personalize `
              -Name "EnableTransparency" `
              -Type DWord `
              -Value 0

          # تقليل تأخير القوائم
          $desktop = "HKCU:\Control Panel\Desktop"

          Set-ItemProperty `
              -Path $desktop `
              -Name "MenuShowDelay" `
              -Value "0"

          Write-Host "Performance optimizations applied."

      # ============================================================
      # 10. بدء الحفظ المستمر
      # ============================================================

      - name: Start continuous backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $syncScript = "C:\Rclone\continuous-sync.ps1"

          $scriptContent = @'
          $ErrorActionPreference = "SilentlyContinue"

          $rclone = "C:\Rclone\rclone.exe"
          $config = "C:\Rclone\rclone.conf"
          $source = "C:\RDPData"
          $remote = "gdrive:RDP-V6-Persistent"
          $interval = 30

          while ($true) {

              try {

                  & $rclone `
                      --config $config `
                      sync `
                      $source `
                      $remote `
                      --create-empty-src-dirs `
                      --fast-list `
                      --transfers 8 `
                      --checkers 16 `
                      --log-level NOTICE `
                      --log-file "C:\Rclone\sync.log"

              }
              catch {
              }

              Start-Sleep -Seconds $interval
          }
          '@

          Set-Content `
              -Path $syncScript `
              -Value $scriptContent `
              -Encoding UTF8

          Start-Process `
              -FilePath "powershell.exe" `
              -ArgumentList @(
                  "-NoProfile",
                  "-ExecutionPolicy",
                  "Bypass",
                  "-WindowStyle",
                  "Hidden",
                  "-File",
                  $syncScript
              ) `
              -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " CONTINUOUS SAVE STARTED"
          Write-Host "=========================================="
          Write-Host "Interval: 30 seconds"
          Write-Host "Source: C:\RDPData"
          Write-Host "Remote: gdrive:RDP-V6-Persistent"
          Write-Host "=========================================="

      # ============================================================
      # 11. معلومات الجهاز
      # ============================================================

      - name: Show system information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " SYSTEM INFORMATION"
          Write-Host "=========================================="

          Get-CimInstance Win32_Processor |
              Select-Object `
                  Name,
                  NumberOfCores,
                  NumberOfLogicalProcessors,
                  MaxClockSpeed |
              Format-List

          Get-CimInstance Win32_ComputerSystem |
              Select-Object `
                  @{Name="RAM_GB";Expression={
                      [math]::Round(
                          $_.TotalPhysicalMemory / 1GB,
                          2
                      )
                  }} |
              Format-List

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " NETWORK"
          Write-Host "=========================================="

          Get-NetAdapter -Physical |
              Where-Object Status -eq "Up" |
              Select-Object `
                  Name,
                  Status,
                  LinkSpeed |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " DISK"
          Write-Host "=========================================="

          Get-PSDrive -PSProvider FileSystem |
              Select-Object `
                  Name,
                  @{Name="FreeGB";Expression={
                      [math]::Round(
                          $_.Free / 1GB,
                          2
                      )
                  }},
                  @{Name="UsedGB";Expression={
                      [math]::Round(
                          $_.Used / 1GB,
                          2
                      )
                  }} |
              Format-Table -AutoSize

      # ============================================================
      # 12. إبقاء الـRunner شغال
      # ============================================================

      - name: Keep RDP alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " WINDOWS RDP IS READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Persistent data : C:\RDPData"
          Write-Host "Backup interval  : 30 seconds"
          Write-Host "Google Drive     : RDP-V6-Persistent"
          Write-Host ""
          Write-Host "Runner will stay alive."
          Write-Host ""

          while ($true) {
              Start-Sleep -Seconds 30000000000
          }
