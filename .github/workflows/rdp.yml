name: Windows RDP V6

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      RDP_USER: "3NB"
      RDP_DATA: "C:\RDPData"
      RCLONE_DIR: "C:\Rclone"
      RCLONE_EXE: "C:\Rclone\rclone.exe"
      RCLONE_CONFIG: "C:\Rclone\rclone.conf"
      RCLONE_REMOTE: "gdrive:RDP-V6-Persistent"
      SYNC_INTERVAL: "30"

    steps:
      # ============================================================
      # 1. Prepare persistent data directory
      # ============================================================
      - name: Prepare persistent storage
        shell: powershell
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:RDP_DATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:RCLONE_DIR | Out-Null

          $jsonPath = Join-Path $env:RCLONE_DIR "service-account.json"

          [System.IO.File]::WriteAllText(
            $jsonPath,
            $env:GOOGLE_SERVICE_ACCOUNT_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      # ============================================================
      # 2. Install ONLY rclone for persistent saving
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone_extract"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $exe = Get-ChildItem `
            -Path $extract `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe was not found."
          }

          Copy-Item $exe.FullName $env:RCLONE_EXE -Force

          & $env:RCLONE_EXE version

      # ============================================================
      # 3. Configure Google Drive
      # ============================================================
      - name: Configure Google Drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          @"
          [gdrive]
          type = drive
          scope = drive
          service_account_file = C:\Rclone\service-account.json
          "@ | Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Encoding UTF8

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            lsd gdrive:

      # ============================================================
      # 4. Restore previous saved data BEFORE starting RDP
      # ============================================================
      - name: Restore saved files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:RDP_DATA | Out-Null

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            sync `
            $env:RCLONE_REMOTE `
            $env:RDP_DATA `
            --create-empty-src-dirs `
            --fast-list `
            --transfers 8 `
            --checkers 16

      # ============================================================
      # 5. Create RDP user
      # ============================================================
      - name: Configure RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser `
              -Name $env:RDP_USER `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $securePassword `
              -PasswordNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 6. Enable RDP
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      # ============================================================
      # 7. Put user folders inside persistent storage
      # ============================================================
      - name: Create persistent user folders
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $folders = @(
            "Desktop",
            "Downloads",
            "Documents",
            "Pictures",
            "Videos",
            "Music"
          )

          foreach ($folder in $folders) {
            $persistent = Join-Path $env:RDP_DATA $folder
            New-Item -ItemType Directory -Force -Path $persistent | Out-Null
          }

          $profile = "C:\Users\$env:RDP_USER"

          foreach ($folder in $folders) {
            $normal = Join-Path $profile $folder
            $persistent = Join-Path $env:RDP_DATA $folder

            if (Test-Path $normal) {
              $item = Get-Item $normal -Force

              if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                Get-ChildItem $normal -Force -ErrorAction SilentlyContinue |
                  Copy-Item -Destination $persistent -Recurse -Force -ErrorAction SilentlyContinue

                Remove-Item $normal -Recurse -Force
              }
            }

            if (-not (Test-Path $normal)) {
              New-Item `
                -ItemType Junction `
                -Path $normal `
                -Target $persistent | Out-Null
            }
          }

      # ============================================================
      # 8. Performance optimizations
      #    No additional applications are installed.
      # ============================================================
      - name: Optimize Windows performance
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # Prefer high performance power plan when available
          powercfg /setactive SCHEME_MIN

          # Disable power saving on network adapters where supported
          Get-NetAdapter -Physical | ForEach-Object {
            try {
              Set-NetAdapterPowerManagement `
                -Name $_.Name `
                -AllowComputerToTurnOffDevice Disabled `
                -ErrorAction SilentlyContinue
            } catch {}
          }

          # Reduce visual effects
          $visualKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

          New-Item `
            -Path $visualKey `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $visualKey `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          # Disable transparency
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item `
            -Path $personalize `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $personalize `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0

          # Reduce Windows animations
          $desktop = "HKCU:\Control Panel\Desktop"

          Set-ItemProperty `
            -Path $desktop `
            -Name "UserPreferencesMask" `
            -Type Binary `
            -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))

      # ============================================================
      # 9. Start CONTINUOUS BACKGROUND SAVE
      #    This starts BEFORE the workflow is kept alive.
      # ============================================================
      - name: Start continuous Google Drive sync
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          $ErrorActionPreference = "SilentlyContinue"

          $rclone = "C:\Rclone\rclone.exe"
          $config = "C:\Rclone\rclone.conf"
          $source = "C:\RDPData"
          $remote = "gdrive:RDP-V6-Persistent"

          while ($true) {
              try {
                  & $rclone `
                    --config $config `
                    sync `
                    $source `
                    $remote `
                    --create-empty-src-dirs `
                    --fast-list `
                    --transfers 8 `
                    --checkers 16 `
                    --log-level NOTICE `
                    --log-file "C:\Rclone\sync.log"
              }
              catch {}

              Start-Sleep -Seconds 30
          }
          '@

          $syncScript = "C:\Rclone\continuous-sync.ps1"

          Set-Content `
            -Path $syncScript `
            -Value $script `
            -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList @(
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-WindowStyle",
              "Hidden",
              "-File",
              $syncScript
            ) `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host "Continuous Google Drive sync started."

      # ============================================================
      # 10. Show system information
      # ============================================================
      - name: Show system performance
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== SYSTEM =========="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed |
            Format-List

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory |
            Format-List

          Write-Host ""
          Write-Host "========== NETWORK =========="

          Get-NetAdapter -Physical |
            Where-Object Status -eq "Up" |
            Select-Object Name, LinkSpeed, Status |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== STORAGE =========="

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{N="FreeGB";E={[math]::Round($_.Free/1GB,2)}},
              @{N="UsedGB";E={[math]::Round(($_.Used)/1GB,2)}} |
            Format-Table -AutoSize

      # ============================================================
      # 11. Keep runner alive
      # ============================================================
      - name: Keep RDP alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RDP RUNNER IS READY"
          Write-Host " Persistent folder: C:\RDPData"
          Write-Host " Google Drive sync: EVERY 30 SECONDS"
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 999999999999999
          }
