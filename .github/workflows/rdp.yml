name: Windows RDP V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025

    timeout-minutes: 3500

    env:
      RDP_USER: '3NB'
      RDP_PROFILE: 'C:\Users\3NB'

    steps:

      # ============================================================
      # STEP 1
      # Configure RDP user
      # ============================================================
      - name: Configure RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "RDP user already exists."

              Set-LocalUser `
                -Name $env:RDP_USER `
                -Password $securePassword
          }
          else {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $env:RDP_USER `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "GitHub Actions RDP user"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


      # ============================================================
      # STEP 2
      # Enable Remote Desktop
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # STEP 3
      # Install and configure Tailscale
      # ============================================================
      - name: Install and configure Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "TS_AUTH_KEY secret is missing."
          }

          $installer = Join-Path `
            $env:TEMP `
            "tailscale-setup.exe"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "$env:ProgramFiles\Tailscale IPN\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
              throw "tailscale.exe was not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key $env:TS_AUTH_KEY `
            --hostname github-rdp-v6 `
            --accept-routes=false `
            --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          & $tailscale ip -4


      # ============================================================
      # STEP 4
      # Initialize RDP profile
      # ============================================================
      - name: Initialize RDP profile
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $credential = New-Object `
            System.Management.Automation.PSCredential(
              $env:RDP_USER,
              $securePassword
            )

          $profile = $env:RDP_PROFILE

          Write-Host "Initializing RDP profile..."

          $job = Start-Job `
            -Credential $credential `
            -ScriptBlock {

                param($profile)

                $ErrorActionPreference = "Stop"

                New-Item `
                  -ItemType Directory `
                  -Path $profile `
                  -Force | Out-Null

                $folders = @(
                    "Desktop",
                    "Downloads",
                    "Documents",
                    "Pictures",
                    "Videos",
                    "Music"
                )

                foreach ($folder in $folders) {

                    $path = Join-Path `
                      $profile `
                      $folder

                    New-Item `
                      -ItemType Directory `
                      -Path $path `
                      -Force | Out-Null
                }

            } `
            -ArgumentList $profile

          Wait-Job $job | Out-Null

          $state = $job.State

          Receive-Job `
            $job `
            -ErrorAction SilentlyContinue

          Remove-Job `
            $job `
            -Force

          if ($state -ne "Completed") {
              throw "Failed to initialize RDP profile. Job state: $state"
          }

          if (-not (Test-Path $profile)) {
              throw "RDP profile was not created."
          }

          Write-Host "RDP profile initialized."


      # ============================================================
      # STEP 5
      # PERFORMANCE OPTIMIZATION
      #
      # Target:
      # Ghidra + RDP
      #
      # We intentionally DO NOT disable:
      # - Windows Defender
      # - Windows Update
      # - Networking
      # - RDP
      # - Tailscale
      # - RPC
      # - Java dependencies
      # ============================================================
      - name: Optimize Windows for Ghidra
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "OPTIMIZING WINDOWS FOR Ghidra"
          Write-Host "============================================================"

          # --------------------------------------------------------
          # High Performance power plan
          # --------------------------------------------------------

          Write-Host "Configuring power plan..."

          powercfg /setactive SCHEME_MIN

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # --------------------------------------------------------
          # Disable visual effects
          # --------------------------------------------------------

          Write-Host "Reducing Windows visual effects..."

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          # Disable transparency

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0

          # --------------------------------------------------------
          # Disable animations
          # --------------------------------------------------------

          New-Item `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name "MinAnimate" `
            -Value "0"

          # --------------------------------------------------------
          # Disable Windows Search indexing
          #
          # Ghidra has its own project/indexing mechanisms.
          # Windows Search indexing is unnecessary here.
          # --------------------------------------------------------

          Write-Host "Disabling Windows Search..."

          Stop-Service `
            -Name "WSearch" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "WSearch" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable SysMain
          #
          # Useful mainly for normal desktop workloads.
          # This RDP is intended for a dedicated analysis workload.
          # --------------------------------------------------------

          Write-Host "Disabling SysMain..."

          Stop-Service `
            -Name "SysMain" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "SysMain" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Print Spooler
          # --------------------------------------------------------

          Write-Host "Disabling Print Spooler..."

          Stop-Service `
            -Name "Spooler" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "Spooler" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Fax
          # --------------------------------------------------------

          Write-Host "Disabling Fax..."

          Stop-Service `
            -Name "Fax" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "Fax" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Xbox services
          # --------------------------------------------------------

          Write-Host "Disabling Xbox services..."

          $xboxServices = @(
              "XboxGipSvc",
              "XblAuthManager",
              "XblGameSave",
              "XboxNetApiSvc"
          )

          foreach ($service in $xboxServices) {

              Stop-Service `
                -Name $service `
                -Force `
                -ErrorAction SilentlyContinue

              Set-Service `
                -Name $service `
                -StartupType Disabled `
                -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # Disable Delivery Optimization
          #
          # Prevents unnecessary peer/background update traffic.
          # Windows Update itself remains enabled.
          # --------------------------------------------------------

          Write-Host "Disabling Delivery Optimization..."

          Stop-Service `
            -Name "DoSvc" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "DoSvc" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Windows Error Reporting service
          # --------------------------------------------------------

          Write-Host "Disabling Windows Error Reporting..."

          Stop-Service `
            -Name "WerSvc" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "WerSvc" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Connected User Experiences / Telemetry
          # --------------------------------------------------------

          Write-Host "Reducing telemetry background activity..."

          Stop-Service `
            -Name "DiagTrack" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "DiagTrack" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Maps Broker
          # --------------------------------------------------------

          Write-Host "Disabling Maps Broker..."

          Stop-Service `
            -Name "MapsBroker" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "MapsBroker" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable downloaded maps
          # --------------------------------------------------------

          Stop-Service `
            -Name "lfsvc" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "lfsvc" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable Retail Demo service
          # --------------------------------------------------------

          Stop-Service `
            -Name "RetailDemo" `
            -Force `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "RetailDemo" `
            -StartupType Disabled `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Disable unnecessary Bluetooth support if present
          #
          # Only if the service exists.
          # --------------------------------------------------------

          $bluetooth = Get-Service `
            -Name "bthserv" `
            -ErrorAction SilentlyContinue

          if ($bluetooth) {

              Write-Host "Disabling Bluetooth service..."

              Stop-Service `
                -Name "bthserv" `
                -Force `
                -ErrorAction SilentlyContinue

              Set-Service `
                -Name "bthserv" `
                -StartupType Disabled `
                -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # Disable unnecessary consumer features
          # --------------------------------------------------------

          Write-Host "Reducing consumer background features..."

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" `
            -Name "DisableWindowsConsumerFeatures" `
            -Type DWord `
            -Value 1

          # --------------------------------------------------------
          # Disable background apps policy
          # --------------------------------------------------------

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" `
            -Name "LetAppsRunInBackground" `
            -Type DWord `
            -Value 2

          # --------------------------------------------------------
          # Reduce RDP visual overhead
          # --------------------------------------------------------

          Write-Host "Optimizing RDP visual performance..."

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fEnableAudioCapture" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "fDisableCdm" `
            -Type DWord `
            -Value 1

          # --------------------------------------------------------
          # Disable hibernation
          # --------------------------------------------------------

          Write-Host "Disabling hibernation..."

          powercfg /hibernate off

          # --------------------------------------------------------
          # Clear temporary files
          # --------------------------------------------------------

          Write-Host "Cleaning temporary files..."

          $tempPaths = @(
              "$env:TEMP\*",
              "$env:WINDIR\Temp\*"
          )

          foreach ($path in $tempPaths) {

              Remove-Item `
                -Path $path `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # Restart Explorer so visual changes apply
          # --------------------------------------------------------

          Write-Host "Refreshing Explorer..."

          Stop-Process `
            -Name explorer `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Start-Process explorer.exe

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "WINDOWS OPTIMIZATION COMPLETE"
          Write-Host "============================================================"


      # ============================================================
      # STEP 6
      # Ghidra-friendly environment
      #
      # No Google Drive.
      # No automatic backup.
      # No automatic restore.
      # No continuous network synchronization.
      # ============================================================
      - name: Configure Ghidra environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CONFIGURING Ghidra ENVIRONMENT"
          Write-Host "============================================================"

          # Create a dedicated workspace for Ghidra.

          $ghidraWorkspace = "$env:RDP_PROFILE\Ghidra"

          New-Item `
            -ItemType Directory `
            -Path $ghidraWorkspace `
            -Force | Out-Null

          Write-Host "Ghidra workspace:"
          Write-Host $ghidraWorkspace

          # Keep common temporary analysis data local.

          $ghidraTemp = "$env:RDP_PROFILE\Ghidra\Temp"

          New-Item `
            -ItemType Directory `
            -Path $ghidraTemp `
            -Force | Out-Null

          Write-Host "Ghidra temp:"
          Write-Host $ghidraTemp

          Write-Host ""
          Write-Host "No automatic backup is configured."
          Write-Host "No Google Drive synchronization is configured."
          Write-Host "No automatic restore is configured."

          Write-Host ""
          Write-Host "Ghidra environment ready."


      # ============================================================
      # STEP 7
      # Display connection information
      # ============================================================
      - name: Show RDP information
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "$env:ProgramFiles\Tailscale IPN\tailscale.exe"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP READY"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USER

          Write-Host ""
          Write-Host "Profile:"
          Write-Host $env:RDP_PROFILE

          Write-Host ""
          Write-Host "Ghidra workspace:"
          Write-Host "$env:RDP_PROFILE\Ghidra"

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          if (Test-Path $tailscale) {
              & $tailscale ip -4
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "STORAGE / NETWORK BEHAVIOR"
          Write-Host "============================================================"
          Write-Host "Google Drive              -> DISABLED"
          Write-Host "Automatic backup          -> DISABLED"
          Write-Host "Automatic restore         -> DISABLED"
          Write-Host "Continuous synchronization -> DISABLED"
          Write-Host "Background file upload    -> DISABLED"
          Write-Host ""
          Write-Host "Windows Defender          -> ENABLED"
          Write-Host "Windows Update            -> ENABLED"
          Write-Host "RDP                       -> ENABLED"
          Write-Host "Tailscale                 -> ENABLED"
          Write-Host "============================================================"


      # ============================================================
      # STEP 8
      # Keep runner alive
      # ============================================================
      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP SESSION IS ACTIVE"
          Write-Host "============================================================"
          Write-Host "Environment optimized for Ghidra."
          Write-Host "No automatic cloud synchronization."
          Write-Host "Runner will remain alive."
          Write-Host "============================================================"

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner alive."

              Start-Sleep -Seconds 400
          }
