name: Windows RDP V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025

    # GitHub Actions maximum lifetime for this workflow
    timeout-minutes: 350

    env:
      RDP_USER: '3NB'
      RDP_PROFILE: 'C:\Users\3NB'

      RCLONE_DIR: 'C:\Rclone'
      RCLONE_EXE: 'C:\Rclone\rclone.exe'
      RCLONE_CONFIG: 'C:\Rclone\rclone.conf'
      RCLONE_REMOTE: 'gdrive:RDP-V6-Persistent'

      SYNC_INTERVAL: '30'

    steps:

      # ============================================================
      # STEP 1
      # Create Rclone directory
      # ============================================================
      - name: Create Rclone directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path $env:RCLONE_DIR `
            -Force | Out-Null

          Write-Host "Rclone directory ready:"
          Write-Host $env:RCLONE_DIR


      # ============================================================
      # STEP 2
      # Install Rclone
      # ============================================================
      - name: Install Rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = Join-Path $env:TEMP "rclone.zip"
          $extractPath = Join-Path $env:TEMP "rclone-extract"

          Write-Host "Downloading rclone..."

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zipPath

          if (Test-Path $extractPath) {
              Remove-Item `
                $extractPath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractPath `
            -Force | Out-Null

          Write-Host "Extracting rclone..."

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractPath `
            -Force

          $rcloneSource = Get-ChildItem `
            -Path $extractPath `
            -Filter "rclone.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $rcloneSource) {
              throw "rclone.exe was not found."
          }

          Copy-Item `
            -Path $rcloneSource.FullName `
            -Destination $env:RCLONE_EXE `
            -Force

          if (-not (Test-Path $env:RCLONE_EXE)) {
              throw "rclone installation failed."
          }

          Write-Host ""
          Write-Host "Rclone installed successfully."
          Write-Host ""

          & $env:RCLONE_EXE version

          if ($LASTEXITCODE -ne 0) {
              throw "rclone version check failed."
          }


      # ============================================================
      # STEP 3
      # Configure Google Drive
      # ============================================================
      - name: Configure Google Drive
        shell: powershell
        env:
          GOOGLE_RCLONE_TOKEN: ${{ secrets.GOOGLE_RCLONE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_RCLONE_TOKEN)) {
              throw "GOOGLE_RCLONE_TOKEN secret is missing."
          }

          Write-Host "Validating Google Drive token..."

          try {
              $null = $env:GOOGLE_RCLONE_TOKEN | ConvertFrom-Json
          }
          catch {
              throw "GOOGLE_RCLONE_TOKEN is not valid JSON."
          }

          $configContent = @"
          [gdrive]
          type = drive
          scope = drive
          token = $env:GOOGLE_RCLONE_TOKEN
          "@

          Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Value $configContent `
            -Encoding UTF8

          if (-not (Test-Path $env:RCLONE_CONFIG)) {
              throw "Failed to create rclone.conf."
          }

          Write-Host "Testing Google Drive..."

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            lsd `
            "gdrive:"

          if ($LASTEXITCODE -ne 0) {
              throw "Google Drive connection failed."
          }

          Write-Host "Google Drive connection OK."


      # ============================================================
      # STEP 4
      # Create persistent directory
      # ============================================================
      - name: Create persistent Google Drive directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating persistent directory..."

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            mkdir `
            $env:RCLONE_REMOTE

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create persistent directory."
          }

          Write-Host "Persistent directory ready."


      # ============================================================
      # STEP 5
      # Configure RDP user
      # ============================================================
      - name: Configure RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "RDP user already exists."

              Set-LocalUser `
                -Name $env:RDP_USER `
                -Password $securePassword

          }
          else {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $env:RDP_USER `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "GitHub Actions RDP user"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


      # ============================================================
      # STEP 6
      # Enable Remote Desktop
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # STEP 7
      # Install and configure Tailscale
      # ============================================================
      - name: Install and configure Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "TS_AUTH_KEY secret is missing."
          }

          $installer = Join-Path `
            $env:TEMP `
            "tailscale-setup.exe"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "$env:ProgramFiles\Tailscale IPN\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
              throw "tailscale.exe was not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key $env:TS_AUTH_KEY `
            --hostname github-rdp-v6 `
            --accept-routes=false `
            --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          & $tailscale ip -4


      # ============================================================
      # STEP 8
      # Initialize RDP profile
      # ============================================================
      - name: Initialize RDP profile
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $credential = New-Object `
            System.Management.Automation.PSCredential(
              $env:RDP_USER,
              $securePassword
            )

          $profile = $env:RDP_PROFILE

          Write-Host "Initializing RDP profile..."

          $job = Start-Job `
            -Credential $credential `
            -ScriptBlock {

                param($profile)

                $ErrorActionPreference = "Stop"

                New-Item `
                  -ItemType Directory `
                  -Path $profile `
                  -Force | Out-Null

                $folders = @(
                    "Desktop",
                    "Downloads",
                    "Documents",
                    "Pictures",
                    "Videos",
                    "Music"
                )

                foreach ($folder in $folders) {

                    $path = Join-Path `
                      $profile `
                      $folder

                    New-Item `
                      -ItemType Directory `
                      -Path $path `
                      -Force | Out-Null
                }

            } `
            -ArgumentList $profile

          Wait-Job $job | Out-Null

          $state = $job.State

          Receive-Job `
            $job `
            -ErrorAction SilentlyContinue

          Remove-Job `
            $job `
            -Force

          if ($state -ne "Completed") {
              throw "Failed to initialize RDP profile. Job state: $state"
          }

          if (-not (Test-Path $profile)) {
              throw "RDP profile was not created."
          }

          Write-Host "RDP profile initialized."


      # ============================================================
      # STEP 9
      #
      # RESTORE LAST SAVED DATA
      #
      # IMPORTANT:
      # This happens BEFORE continuous mirror starts.
      #
      # Google Drive -> NEW RDP
      #
      # We intentionally use COPY here.
      # ============================================================
      - name: Restore latest persistent files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $maps = @(
              @{
                  Name   = "Desktop"
                  Local  = "$env:RDP_PROFILE\Desktop"
                  Remote = "$env:RCLONE_REMOTE/Desktop"
              },
              @{
                  Name   = "Downloads"
                  Local  = "$env:RDP_PROFILE\Downloads"
                  Remote = "$env:RCLONE_REMOTE/Downloads"
              },
              @{
                  Name   = "Documents"
                  Local  = "$env:RDP_PROFILE\Documents"
                  Remote = "$env:RCLONE_REMOTE/Documents"
              },
              @{
                  Name   = "Pictures"
                  Local  = "$env:RDP_PROFILE\Pictures"
                  Remote = "$env:RCLONE_REMOTE/Pictures"
              },
              @{
                  Name   = "Videos"
                  Local  = "$env:RDP_PROFILE\Videos"
                  Remote = "$env:RCLONE_REMOTE/Videos"
              },
              @{
                  Name   = "Music"
                  Local  = "$env:RDP_PROFILE\Music"
                  Remote = "$env:RCLONE_REMOTE/Music"
              }
          )

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RESTORING LAST SAVED DATA"
          Write-Host "============================================================"

          foreach ($map in $maps) {

              Write-Host ""
              Write-Host "Restoring: $($map.Name)"
              Write-Host "From: $($map.Remote)"
              Write-Host "To  : $($map.Local)"

              New-Item `
                -ItemType Directory `
                -Path $map.Local `
                -Force | Out-Null

              & $env:RCLONE_EXE `
                --config $env:RCLONE_CONFIG `
                copy `
                $map.Remote `
                $map.Local `
                --create-empty-src-dirs `
                --transfers 2 `
                --checkers 8 `
                --retries 10 `
                --low-level-retries 20 `
                --retries-sleep 10s `
                --timeout 15m `
                --contimeout 60s `
                --drive-chunk-size 64Mi `
                --stats 10s

              if ($LASTEXITCODE -ne 0) {
                  throw "Restore failed for $($map.Name). ExitCode=$LASTEXITCODE"
              }

              Write-Host "Restore completed: $($map.Name)"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ALL DATA RESTORED"
          Write-Host "============================================================"


      # ============================================================
      # STEP 10
      # Verify restored profile
      # ============================================================
      - name: Verify restored profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:RDP_PROFILE)) {
              throw "RDP profile does not exist."
          }

          $folders = @(
              "Desktop",
              "Downloads",
              "Documents",
              "Pictures",
              "Videos",
              "Music"
          )

          foreach ($folder in $folders) {

              $path = Join-Path `
                $env:RDP_PROFILE `
                $folder

              if (-not (Test-Path $path)) {
                  throw "Missing folder: $path"
              }

              Write-Host "Verified: $path"
          }

          Write-Host ""
          Write-Host "Profile verification successful."


      # ============================================================
      # STEP 11
      # Power configuration
      # ============================================================
      - name: Configure power settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          powercfg /setactive SCHEME_MIN

          Write-Host "Power plan configured."


      # ============================================================
      # STEP 12
      #
      # CONTINUOUS TRUE MIRROR
      #
      # RDP -> Google Drive
      #
      # ADD    -> ADD
      # MODIFY -> UPDATE
      # DELETE -> DELETE
      #
      # NO ARTIFICIAL TOTAL TIMEOUT
      # ============================================================
      - name: Start continuous mirror backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = "$env:RCLONE_DIR\continuous-sync.ps1"

          @'
          $ErrorActionPreference = "Continue"

          $rclone = "C:\Rclone\rclone.exe"
          $config = "C:\Rclone\rclone.conf"

          $profile = "C:\Users\3NB"
          $remoteRoot = "gdrive:RDP-V6-Persistent"

          $interval = 30

          $log = "C:\Rclone\continuous-sync.log"
          $rcloneLog = "C:\Rclone\rclone-mirror.log"

          $maps = @(
              @{
                  Name   = "Desktop"
                  Local  = "$profile\Desktop"
                  Remote = "$remoteRoot/Desktop"
              },
              @{
                  Name   = "Downloads"
                  Local  = "$profile\Downloads"
                  Remote = "$remoteRoot/Downloads"
              },
              @{
                  Name   = "Documents"
                  Local  = "$profile\Documents"
                  Remote = "$remoteRoot/Documents"
              },
              @{
                  Name   = "Pictures"
                  Local  = "$profile\Pictures"
                  Remote = "$remoteRoot/Pictures"
              },
              @{
                  Name   = "Videos"
                  Local  = "$profile\Videos"
                  Remote = "$remoteRoot/Videos"
              },
              @{
                  Name   = "Music"
                  Local  = "$profile\Music"
                  Remote = "$remoteRoot/Music"
              }
          )

          function Write-Log {
              param(
                  [string]$Message
              )

              $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Add-Content `
                -Path $log `
                -Value "[$timestamp] $Message"
          }

          Write-Log "============================================================"
          Write-Log "CONTINUOUS MIRROR STARTED"
          Write-Log "Source: C:\Users\3NB"
          Write-Log "Destination: gdrive:RDP-V6-Persistent"
          Write-Log "============================================================"

          while ($true) {

              foreach ($map in $maps) {

                  $name = $map.Name
                  $local = $map.Local
                  $remote = $map.Remote

                  try {

                      if (-not (Test-Path -LiteralPath $local)) {

                          New-Item `
                            -ItemType Directory `
                            -Path $local `
                            -Force | Out-Null

                          Write-Log "Created missing folder: $local"
                      }

                      Write-Log "------------------------------------------------------------"
                      Write-Log "Starting mirror: $name"

                      $arguments = @(
                          "--config", $config,

                          "sync",

                          $local,
                          $remote,

                          "--transfers", "2",
                          "--checkers", "8",

                          "--retries", "10",
                          "--low-level-retries", "20",
                          "--retries-sleep", "10s",

                          "--timeout", "15m",
                          "--contimeout", "60s",

                          "--create-empty-src-dirs",

                          "--drive-chunk-size", "64Mi",

                          "--stats", "30s",

                          "--log-file", $rcloneLog,
                          "--log-level", "INFO"
                      )

                      #
                      # Separate process.
                      #
                      $process = Start-Process `
                        -FilePath $rclone `
                        -ArgumentList $arguments `
                        -WindowStyle Hidden `
                        -PassThru

                      Write-Log "rclone PID=$($process.Id)"

                      #
                      # Wait until this folder is actually finished.
                      #
                      # NO 30-minute kill.
                      # NO 60-minute kill.
                      #
                      # A 2GB upload can therefore finish normally.
                      #
                      $process.WaitForExit()

                      $exitCode = $process.ExitCode

                      if ($exitCode -eq 0) {

                          Write-Log "Mirror completed: $name"
                          Write-Log "ExitCode=0"

                      }
                      else {

                          Write-Log "Mirror failed: $name"
                          Write-Log "ExitCode=$exitCode"
                          Write-Log "Moving to next folder."
                      }

                      $process.Dispose()
                  }
                  catch {

                      Write-Log "ERROR in $name"
                      Write-Log $_.Exception.Message
                      Write-Log "Moving to next folder."
                  }
              }

              Write-Log "============================================================"
              Write-Log "Full mirror cycle completed."
              Write-Log "Sleeping $interval seconds."
              Write-Log "============================================================"

              Start-Sleep -Seconds $interval
          }

          '@ | Set-Content `
            -Path $scriptPath `
            -Encoding UTF8

          #
          # Stop an old copy of our mirror script.
          #
          $oldProcesses = Get-CimInstance Win32_Process `
            -Filter "Name = 'powershell.exe'" |
            Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like "*C:\Rclone\continuous-sync.ps1*"
            }

          foreach ($old in $oldProcesses) {

              Write-Host "Stopping old mirror process PID=$($old.ProcessId)"

              Stop-Process `
                -Id $old.ProcessId `
                -Force `
                -ErrorAction SilentlyContinue
          }

          #
          # Start mirror in background.
          #
          Start-Process `
            -FilePath "powershell.exe" `
            -ArgumentList @(
                "-NoProfile",
                "-NonInteractive",
                "-ExecutionPolicy", "Bypass",
                "-WindowStyle", "Hidden",
                "-File", $scriptPath
            ) `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CONTINUOUS MIRROR IS RUNNING"
          Write-Host "============================================================"
          Write-Host "Add    -> Upload"
          Write-Host "Modify -> Update"
          Write-Host "Delete -> Delete from Drive"
          Write-Host ""
          Write-Host "Log:"
          Write-Host "C:\Rclone\continuous-sync.log"
          Write-Host ""
          Write-Host "Rclone log:"
          Write-Host "C:\Rclone\rclone-mirror.log"
          Write-Host "============================================================"


      # ============================================================
      # STEP 13
      # Display connection information
      # ============================================================
      - name: Show RDP information
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "$env:ProgramFiles\Tailscale IPN\tailscale.exe"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP READY"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USER

          Write-Host ""
          Write-Host "Profile:"
          Write-Host $env:RDP_PROFILE

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          if (Test-Path $tailscale) {
              & $tailscale ip -4
          }

          Write-Host ""
          Write-Host "Persistent Drive:"
          Write-Host $env:RCLONE_REMOTE

          Write-Host ""
          Write-Host "Mirror log:"
          Write-Host "C:\Rclone\continuous-sync.log"

          Write-Host ""
          Write-Host "Rclone log:"
          Write-Host "C:\Rclone\rclone-mirror.log"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "Storage behavior:"
          Write-Host "New file      -> Google Drive"
          Write-Host "Modified file -> Google Drive"
          Write-Host "Deleted file  -> Google Drive"
          Write-Host "New RDP       -> Restore latest Drive data"
          Write-Host "============================================================"


      # ============================================================
      # STEP 14
      # Keep runner alive
      # ============================================================
      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP SESSION IS ACTIVE"
          Write-Host "============================================================"
          Write-Host "Continuous mirror is running."
          Write-Host "Runner will remain alive."
          Write-Host "============================================================"

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner alive."

              Start-Sleep -Seconds 400
          }
