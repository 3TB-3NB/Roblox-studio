name: Windows RDP V6

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      RDP_USER: '3NB'
      RDP_PROFILE: 'C:\Users\3NB'

      RCLONE_DIR: 'C:\Rclone'
      RCLONE_EXE: 'C:\Rclone\rclone.exe'
      RCLONE_CONFIG: 'C:\Rclone\rclone.conf'

      RCLONE_REMOTE: 'gdrive:RDP-V6-Persistent'

      SYNC_INTERVAL: '30'

    steps:

      # ============================================================
      # 1. Prepare directories
      # ============================================================
      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:RCLONE_DIR |
            Out-Null

          Write-Host "Rclone directory ready."


      # ============================================================
      # 2. Install rclone
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone_extract"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Write-Host "Downloading rclone..."

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          Write-Host "Extracting rclone..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $exe = Get-ChildItem `
            -Path $extract `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe was not found."
          }

          Copy-Item `
            -Path $exe.FullName `
            -Destination $env:RCLONE_EXE `
            -Force

          Write-Host "Rclone installed."

          & $env:RCLONE_EXE version


      # ============================================================
      # 3. Configure Google Drive
      # ============================================================
      - name: Configure Google Drive
        shell: powershell
        env:
          GOOGLE_RCLONE_TOKEN: ${{ secrets.GOOGLE_RCLONE_TOKEN }}

        run: |
          $ErrorActionPreference = "Stop"

          $token = $env:GOOGLE_RCLONE_TOKEN.Trim()

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "GOOGLE_RCLONE_TOKEN is empty."
          }

          try {
            $null = $token | ConvertFrom-Json
          }
          catch {
            throw "GOOGLE_RCLONE_TOKEN is not valid JSON."
          }

          $config = @"
          [gdrive]
          type = drive
          scope = drive
          token = $token
          "@

          Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Value $config `
            -Encoding UTF8

          Write-Host "Testing Google Drive connection..."

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            lsd gdrive:

          if ($LASTEXITCODE -ne 0) {
            throw "Google Drive connection failed."
          }

          Write-Host "Google Drive connection OK."


      # ============================================================
      # 4. Prepare Google Drive folder
      # ============================================================
      - name: Prepare Google Drive folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & $env:RCLONE_EXE `
            --config $env:RCLONE_CONFIG `
            mkdir $env:RCLONE_REMOTE

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create/access Google Drive folder."
          }

          Write-Host "Google Drive folder is ready."


      # ============================================================
      # 5. Configure RDP user
      # ============================================================
      - name: Configure RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD is empty."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if (-not $existing) {

            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $password `
              -FullName $env:RDP_USER `
              -Description "GitHub Actions RDP User" `
              -PasswordNeverExpires:$true `
              -AccountNeverExpires:$true

          }
          else {

            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name $env:RDP_USER `
              -Password $password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


      # ============================================================
      # 6. Enable Remote Desktop
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # 7. Install Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}

        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TS_AUTH_KEY is empty."
          }

          $installer = "$env:TEMP\tailscale-setup.exe"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale was not installed."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key $env:TS_AUTH_KEY `
            --hostname github-rdp-v6 `
            --accept-routes=false `
            --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Write-Host "Tailscale connected."

          Write-Host "Tailscale IPv4:"
          & $tailscale ip -4


      # ============================================================
      # 8. Initialize actual 3NB profile
      # ============================================================
      - name: Initialize RDP user profile
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $credential = New-Object `
            System.Management.Automation.PSCredential(
              "$env:COMPUTERNAME\$env:RDP_USER",
              $securePassword
            )

          Write-Host "Initializing profile for $env:RDP_USER..."

          Start-Process `
            -FilePath "powershell.exe" `
            -Credential $credential `
            -ArgumentList "-NoProfile", "-Command", "exit" `
            -Wait

          Start-Sleep -Seconds 3

          if (-not (Test-Path $env:RDP_PROFILE)) {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $env:RDP_PROFILE |
              Out-Null
          }

          $folders = @(
            "Desktop",
            "Downloads",
            "Documents",
            "Pictures",
            "Videos",
            "Music"
          )

          foreach ($folder in $folders) {

            $path = Join-Path `
              $env:RDP_PROFILE `
              $folder

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $path |
              Out-Null
          }

          Write-Host "Profile ready:"
          Write-Host $env:RDP_PROFILE


      # ============================================================
      # 9. Restore persistent files
      # ============================================================
      - name: Restore persistent files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $maps = @(
            @{
              Name   = "Desktop"
              Local  = "$env:RDP_PROFILE\Desktop"
              Remote = "$env:RCLONE_REMOTE/Desktop"
            },
            @{
              Name   = "Downloads"
              Local  = "$env:RDP_PROFILE\Downloads"
              Remote = "$env:RCLONE_REMOTE/Downloads"
            },
            @{
              Name   = "Documents"
              Local  = "$env:RDP_PROFILE\Documents"
              Remote = "$env:RCLONE_REMOTE/Documents"
            },
            @{
              Name   = "Pictures"
              Local  = "$env:RDP_PROFILE\Pictures"
              Remote = "$env:RCLONE_REMOTE/Pictures"
            },
            @{
              Name   = "Videos"
              Local  = "$env:RDP_PROFILE\Videos"
              Remote = "$env:RCLONE_REMOTE/Videos"
            },
            @{
              Name   = "Music"
              Local  = "$env:RDP_PROFILE\Music"
              Remote = "$env:RCLONE_REMOTE/Music"
            }
          )

          foreach ($map in $maps) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "Restoring $($map.Name)"
            Write-Host "Remote: $($map.Remote)"
            Write-Host "Local:  $($map.Local)"
            Write-Host "=========================================="

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $map.Local |
              Out-Null

            & $env:RCLONE_EXE `
              --config $env:RCLONE_CONFIG `
              copy $map.Remote $map.Local `
              --create-empty-src-dirs `
              --transfers 4 `
              --checkers 8 `
              --fast-list `
              --stats 10s

            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for $($map.Name)."
            }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RESTORE COMPLETED"
          Write-Host "=========================================="


      # ============================================================
      # 10. Verify profile
      # ============================================================
      - name: Verify RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "RDP PROFILE"
          Write-Host "=========================================="

          Write-Host "User:"
          Write-Host $env:RDP_USER

          Write-Host ""
          Write-Host "Profile:"
          Write-Host $env:RDP_PROFILE

          Write-Host ""
          Write-Host "Folders:"

          Get-ChildItem `
            -Path $env:RDP_PROFILE `
            -Directory |
            Select-Object Name, FullName |
            Format-Table -AutoSize


      # ============================================================
      # 11. Optimize Windows
      # ============================================================
      - name: Optimize Windows performance
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          powercfg /setactive SCHEME_MIN

          Write-Host "High Performance power plan enabled."


      # ============================================================
      # 12. Start continuous backup
      # ============================================================
      - name: Start continuous backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = "$env:RCLONE_DIR\continuous-sync.ps1"

          $script = @'
          $ErrorActionPreference = "SilentlyContinue"

          $rclone = "C:\Rclone\rclone.exe"
          $config = "C:\Rclone\rclone.conf"

          $profile = "C:\Users\3NB"

          $interval = 30

          $log = "C:\Rclone\continuous-sync.log"

          $maps = @(
              @{
                  Name   = "Desktop"
                  Local  = "$profile\Desktop"
                  Remote = "gdrive:RDP-V6-Persistent/Desktop"
              },
              @{
                  Name   = "Downloads"
                  Local  = "$profile\Downloads"
                  Remote = "gdrive:RDP-V6-Persistent/Downloads"
              },
              @{
                  Name   = "Documents"
                  Local  = "$profile\Documents"
                  Remote = "gdrive:RDP-V6-Persistent/Documents"
              },
              @{
                  Name   = "Pictures"
                  Local  = "$profile\Pictures"
                  Remote = "gdrive:RDP-V6-Persistent/Pictures"
              },
              @{
                  Name   = "Videos"
                  Local  = "$profile\Videos"
                  Remote = "gdrive:RDP-V6-Persistent/Videos"
              },
              @{
                  Name   = "Music"
                  Local  = "$profile\Music"
                  Remote = "gdrive:RDP-V6-Persistent/Music"
              }
          )

          Add-Content `
              -Path $log `
              -Value "============================================================"

          Add-Content `
              -Path $log `
              -Value "Continuous sync started."

          while ($true) {

              foreach ($map in $maps) {

                  try {

                      if (-not (Test-Path $map.Local)) {
                          New-Item `
                              -ItemType Directory `
                              -Force `
                              -Path $map.Local |
                              Out-Null
                      }

                      $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

                      Add-Content `
                          -Path $log `
                          -Value "[$timestamp] Sync $($map.Name) started."

                      & $rclone `
                          --config $config `
                          sync `
                          $map.Local `
                          $map.Remote `
                          --create-empty-src-dirs `
                          --transfers 4 `
                          --checkers 8 `
                          --fast-list `
                          --stats 0

                      $exitCode = $LASTEXITCODE

                      $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

                      Add-Content `
                          -Path $log `
                          -Value "[$timestamp] Sync $($map.Name) finished. ExitCode=$exitCode"

                  }
                  catch {

                      $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

                      Add-Content `
                          -Path $log `
                          -Value "[$timestamp] ERROR $($map.Name): $($_.Exception.Message)"
                  }
              }

              Start-Sleep -Seconds $interval
          }

          '@

          Set-Content `
            -Path $scriptPath `
            -Value $script `
            -Encoding UTF8

          Write-Host "Starting continuous backup..."

          Start-Process `
            -FilePath "powershell.exe" `
            -WindowStyle Hidden `
            -ArgumentList @(
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              $scriptPath
            )

          Start-Sleep -Seconds 2

          Write-Host "=========================================="
          Write-Host "CONTINUOUS BACKUP STARTED"
          Write-Host "=========================================="

          Write-Host "Source:"
          Write-Host "C:\Users\3NB"

          Write-Host ""
          Write-Host "Destination:"
          Write-Host "gdrive:RDP-V6-Persistent"

          Write-Host ""
          Write-Host "Sync interval:"
          Write-Host "30 seconds"


      # ============================================================
      # 13. Show RDP information
      # ============================================================
      - name: Show RDP information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " WINDOWS RDP V6"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host $env:RDP_USER

          Write-Host ""
          Write-Host "RDP PROFILE:"
          Write-Host $env:RDP_PROFILE

          Write-Host ""
          Write-Host "TAILSCALE IPv4:"

          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "PERSISTENT STORAGE:"
          Write-Host $env:RCLONE_REMOTE

          Write-Host ""
          Write-Host "RESTORE:"
          Write-Host "Google Drive -> C:\Users\3NB on startup"

          Write-Host ""
          Write-Host "BACKUP:"
          Write-Host "C:\Users\3NB -> Google Drive"

          Write-Host ""
          Write-Host "SYNC INTERVAL:"
          Write-Host "30 seconds"

          Write-Host ""
          Write-Host "=========================================="


      # ============================================================
      # 14. Keep RDP alive
      # ============================================================
      - name: Keep RDP alive
        shell: powershell
        run: |
          while ($true) {

            Write-Host ""
            Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - RDP alive"

            Start-Sleep -Seconds 400
          }
